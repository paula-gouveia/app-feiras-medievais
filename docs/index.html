<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feiras Medievais · Portugal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown-dark:   #3d2b1a;
      --brown-mid:    #6b4226;
      --gold:         #b8860b;
      --gold-light:   #d4a017;
      --cream:        #fdf6e9;
      --cream-dark:   #f0e6d0;
      --white:        #ffffff;
      --gray:         #9e9e9e;
      --text:         #2d2015;
      --text-light:   #6b5c4a;
      --border:       #e0d0b8;
      --shadow:       rgba(61, 43, 26, 0.1);
      --radius:       12px;
      --header-h:     56px;
      --bottom-nav-h: 60px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      padding-top: var(--header-h);
      padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
    }

    /* Previne scroll de fundo quando o sheet esta aberto */
    body.sheet-aberto { overflow: hidden; }

    /* ------------------------------------------------------------------ */
    /* CABECALHO                                                            */
    /* ------------------------------------------------------------------ */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--brown-dark);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.02em;
    }

    /* ------------------------------------------------------------------ */
    /* BOTTOM NAV (mobile)                                                  */
    /* ------------------------------------------------------------------ */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 1000;
      box-shadow: 0 -2px 8px var(--shadow);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--gray);
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      transition: color 0.15s;
      padding: 0.5rem;
    }

    .bottom-nav-btn.active { color: var(--brown-dark); }
    .bottom-nav-btn .nav-icon { font-size: 1.35rem; line-height: 1; }

    /* ------------------------------------------------------------------ */
    /* CONTEUDO PRINCIPAL                                                   */
    /* ------------------------------------------------------------------ */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    /* ------------------------------------------------------------------ */
    /* FILTROS                                                              */
    /* ------------------------------------------------------------------ */
    .controls {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1rem;
      flex-direction: column;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }

    .search-wrap input {
      border: none; outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      width: 100%;
      color: var(--text);
      background: transparent;
    }

    .search-wrap input::placeholder { color: var(--gray); }

    .filter-group {
      display: flex;
      gap: 0.25rem;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .filter-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-light);
      white-space: nowrap;
      text-align: center;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn.active { background: var(--brown-dark); color: var(--cream); }

    .results-info {
      font-size: 0.82rem;
      color: var(--text-light);
      margin-bottom: 0.75rem;
    }

    /* ------------------------------------------------------------------ */
    /* LOADING & ERRO                                                       */
    /* ------------------------------------------------------------------ */
    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-light);
    }

    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--brown-mid);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    /* ------------------------------------------------------------------ */
    /* GRID DE CARDS                                                        */
    /* ------------------------------------------------------------------ */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 6px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px var(--shadow);
    }

    .card-img {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
    }

    .card-img-placeholder {
      width: 100%; height: 130px;
      background: linear-gradient(135deg, var(--cream-dark) 0%, var(--border) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; opacity: 0.6;
    }

    .card-body {
      padding: 1rem; flex: 1;
      display: flex; flex-direction: column;
    }

    .card-nome {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem; font-weight: 600;
      color: var(--brown-dark);
      line-height: 1.35; margin-bottom: 0.4rem;
    }

    .card-dates {
      font-size: 0.78rem; font-weight: 600;
      color: var(--gold); margin-bottom: 0.25rem;
    }

    .card-location {
      font-size: 0.78rem; color: var(--text-light);
      margin-bottom: 0.75rem; line-height: 1.4;
    }

    .card-footer {
      margin-top: auto; padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between;
      align-items: center; gap: 0.5rem;
    }

    .badges { display: flex; gap: 0.3rem; flex-wrap: wrap; }

    .badge {
      font-size: 0.68rem; font-weight: 500;
      padding: 0.18rem 0.5rem; border-radius: 20px;
    }

    .badge-fm  { background: #ede9e0; color: #5c4a2a; }
    .badge-adv { background: #e8f0e8; color: #3a5c3a; }
    .badge-gps { background: #e3f0ff; color: #1a5fb4; }

    .card-link {
      font-size: 0.74rem; color: var(--brown-mid);
      font-weight: 600; white-space: nowrap;
    }

    .empty-state {
      grid-column: 1 / -1; text-align: center;
      padding: 4rem 1rem; color: var(--text-light);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }

    .empty-state h3 {
      font-family: 'Cinzel', serif; font-size: 1.1rem;
      color: var(--brown-dark); margin-bottom: 0.4rem;
    }

    /* ------------------------------------------------------------------ */
    /* MAPA                                                                 */
    /* ------------------------------------------------------------------ */
    #map-view { display: none; }

    .map-info {
      font-size: 0.8rem; color: var(--text-light);
      margin-bottom: 0.6rem;
    }

    #mapa {
      height: calc(
        100vh
        - var(--header-h)
        - var(--bottom-nav-h)
        - env(safe-area-inset-bottom, 0px)
        - 2.5rem
        - 2rem
      );
      min-height: 380px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .popup-nome {
      font-family: 'Cinzel', serif; font-size: 0.88rem;
      font-weight: 600; color: var(--brown-dark);
      margin-bottom: 0.3rem; line-height: 1.3;
    }
    .popup-dates { font-size: 0.76rem; font-weight: 600; color: var(--gold); margin-bottom: 0.2rem; }
    .popup-loc   { font-size: 0.74rem; color: var(--text-light); margin-bottom: 0.4rem; }
    .popup-link  { font-size: 0.74rem; color: var(--brown-mid); font-weight: 600; text-decoration: none; }
    .popup-link:hover { color: var(--gold); }

    /* ------------------------------------------------------------------ */
    /* MODAL DE DETALHE (bottom sheet)                                     */
    /* ------------------------------------------------------------------ */
    .detalhe-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .detalhe-overlay.aberto {
      opacity: 1; pointer-events: all;
    }

    .detalhe-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 2001;
      background: var(--white);
      border-radius: 20px 20px 0 0;
      max-height: 92vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .detalhe-sheet.aberto { transform: translateY(0); }

    .detalhe-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
    }

    .detalhe-img {
      width: 100%; height: 200px;
      object-fit: cover; display: block;
      margin-top: 0.75rem;
    }

    .detalhe-img-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, var(--cream-dark) 0%, var(--border) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; opacity: 0.5;
      margin-top: 0.75rem;
    }

    .detalhe-body {
      padding: 1.25rem 1.25rem 1.5rem;
    }

    .detalhe-nome {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem; font-weight: 700;
      color: var(--brown-dark);
      line-height: 1.3; margin-bottom: 0.75rem;
    }

    .detalhe-row {
      display: flex; align-items: flex-start;
      gap: 0.5rem; margin-bottom: 0.55rem;
      font-size: 0.875rem; color: var(--text-light);
      line-height: 1.45;
    }

    .detalhe-row .di { flex-shrink: 0; font-size: 1rem; }

    .detalhe-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    .detalhe-badges {
      display: flex; flex-wrap: wrap;
      gap: 0.35rem; margin-bottom: 1.25rem;
    }

    .detalhe-btn-web {
      display: flex; align-items: center;
      justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.85rem;
      background: var(--brown-dark);
      color: var(--cream);
      border: none; border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }

    .detalhe-btn-web:hover { background: var(--brown-mid); }

    .detalhe-close {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 32px; height: 32px;
      background: var(--cream-dark);
      border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; cursor: pointer;
      color: var(--text-light); line-height: 1; z-index: 1;
    }

    /* ------------------------------------------------------------------ */
    /* DESKTOP (>=768px)                                                    */
    /* ------------------------------------------------------------------ */
    @media (min-width: 768px) {
      body { padding-bottom: 0; }

      header { justify-content: space-between; padding: 0 1.5rem; }

      .bottom-nav { display: none; }

      .desktop-tabs {
        display: flex !important; gap: 0.2rem;
        background: rgba(255,255,255,0.08);
        border-radius: 8px; padding: 3px;
      }

      .desktop-tab-btn {
        background: transparent; border: none;
        color: rgba(253,246,233,0.65);
        padding: 0.35rem 1rem; border-radius: 6px;
        cursor: pointer; font-family: 'Inter', sans-serif;
        font-size: 0.85rem; font-weight: 500;
        white-space: nowrap;
        transition: background 0.15s, color 0.15s;
      }

      .desktop-tab-btn.active { background: var(--gold-light); color: var(--brown-dark); }
      .desktop-tab-btn:hover:not(.active) { background: rgba(255,255,255,0.12); color: var(--cream); }

      main { padding: 1.5rem; }

      .controls { flex-direction: row; align-items: center; }
      .search-wrap { flex: 1; min-width: 220px; }
      .filter-group { width: auto; }
      .filter-btn { flex: none; padding: 0.35rem 0.8rem; }

      #mapa { height: calc(100vh - var(--header-h) - 5rem); }

      .detalhe-sheet {
        left: 50%; right: auto;
        width: 480px;
        transform: translateX(-50%) translateY(100%);
        border-radius: 20px 20px 0 0;
      }

      .detalhe-sheet.aberto {
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>

<body>

<!-- CABECALHO -->
<header>
  <h1>&#x2694;&#xFE0F; Feiras Medievais &middot; Portugal</h1>
  <nav class="desktop-tabs" style="display:none" aria-label="Navegacao">
    <button class="desktop-tab-btn active" data-tab="lista" onclick="switchTab('lista')">&#x1F4CB; Lista</button>
    <button class="desktop-tab-btn"        data-tab="mapa"  onclick="switchTab('mapa')">&#x1F5FA;&#xFE0F; Mapa</button>
  </nav>
</header>

<!-- CONTEUDO PRINCIPAL -->
<main>

  <div class="controls" id="controls-bar">
    <div class="search-wrap">
      <span>&#x1F50D;</span>
      <input type="search" id="search-input" autocomplete="off"
             placeholder="Pesquisar por nome, localidade&#x2026;"
             oninput="applyFilters()">
    </div>
    <div class="filter-group" role="group">
      <button class="filter-btn active" data-filter="proximas" onclick="setTimeFilter('proximas')">Em curso e pr&#xF3;ximas</button>
      <button class="filter-btn"        data-filter="30d"      onclick="setTimeFilter('30d')">30 dias</button>
      <button class="filter-btn"        data-filter="3m"       onclick="setTimeFilter('3m')">3 meses</button>
    </div>
  </div>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <!-- Vista: Lista -->
  <div id="lista-view">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>A carregar feiras&#x2026;</p>
    </div>
    <p class="results-info" id="results-info" style="display:none"></p>
    <div class="cards-grid" id="cards-container"></div>
  </div>

  <!-- Vista: Mapa -->
  <div id="map-view">
    <p class="map-info" id="map-info"></p>
    <div id="mapa"></div>
  </div>

</main>

<!-- MODAL DE DETALHE -->
<div class="detalhe-overlay" id="detalhe-overlay" onclick="closeDetalhe()"></div>

<div class="detalhe-sheet" id="detalhe-sheet" role="dialog" aria-modal="true" aria-labelledby="detalhe-nome">
  <div class="detalhe-handle"></div>
  <button class="detalhe-close" onclick="closeDetalhe()" aria-label="Fechar">&#x2715;</button>

  <img id="detalhe-img" class="detalhe-img" src="" alt="" style="display:none">
  <div id="detalhe-img-ph" class="detalhe-img-placeholder">&#x1F3F0;</div>

  <div class="detalhe-body">
    <h2 class="detalhe-nome" id="detalhe-nome"></h2>

    <div class="detalhe-row" id="detalhe-datas">
      <span class="di">&#x1F4C5;</span><span></span>
    </div>
    <div class="detalhe-row" id="detalhe-local">
      <span class="di">&#x1F4CD;</span><span></span>
    </div>
    <div class="detalhe-row" id="detalhe-coords" style="display:none">
      <span class="di">&#x1F5FA;&#xFE0F;</span><span></span>
    </div>
    <div class="detalhe-row" id="detalhe-descricao" style="display:none">
      <span class="di">&#x1F4DC;</span><span></span>
    </div>

    <hr class="detalhe-divider">

    <div class="detalhe-badges" id="detalhe-badges"></div>

    <a class="detalhe-btn-web" id="detalhe-btn-web" href="#" target="_blank" rel="noopener noreferrer">
      &#x1F310; Visitar p&#xE1;gina web
    </a>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" aria-label="Navegacao">
  <button class="bottom-nav-btn active" data-tab="lista" onclick="switchTab('lista')">
    <span class="nav-icon">&#x1F4CB;</span>
    <span>Lista</span>
  </button>
  <button class="bottom-nav-btn" data-tab="mapa" onclick="switchTab('mapa')">
    <span class="nav-icon">&#x1F5FA;&#xFE0F;</span>
    <span>Mapa</span>
  </button>
</nav>

<!-- SCRIPTS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>

<script>
  /* ==================================================================
     ESTADO
  ================================================================== */
  let todasFeiras     = [];
  let feirasFiltradas = [];
  let currentTab        = 'lista';
  let currentTimeFilter = 'proximas';
  let mapa      = null;
  let marcadores = [];

  /* ==================================================================
     DATAS
  ================================================================== */
  const MESES = [
    'janeiro','fevereiro','março','abril','maio','junho',
    'julho','agosto','setembro','outubro','novembro','dezembro'
  ];

  function hoje() {
    return new Date().toISOString().slice(0, 10);
  }

  function maisNDias(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function maisNMeses(n) {
    const d = new Date();
    d.setMonth(d.getMonth() + n);
    return d.toISOString().slice(0, 10);
  }

  function formatData(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${parseInt(d)} ${MESES[parseInt(m) - 1]} ${y}`;
  }

  function formatPeriodo(inicio, fim) {
    if (!inicio) return '—';
    if (!fim || fim === inicio) return formatData(inicio);
    const [y1, m1, d1] = inicio.split('-').map(Number);
    const [y2, m2, d2] = fim.split('-').map(Number);
    if (y1 === y2 && m1 === m2) return `${d1}–${d2} ${MESES[m1-1]} ${y1}`;
    if (y1 === y2) return `${d1} ${MESES[m1-1]} – ${d2} ${MESES[m2-1]} ${y1}`;
    return `${formatData(inicio)} – ${formatData(fim)}`;
  }

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ==================================================================
     SUPABASE
  ================================================================== */
  async function fetchFeiras() {
    const url = `${CONFIG.supabaseUrl}/rest/v1/feiras`
      + `?select=*&order=data_inicio.asc,nome.asc&limit=2000`;
    const resp = await fetch(url, {
      headers: {
        'apikey': CONFIG.supabaseAnonKey,
        'Authorization': `Bearer ${CONFIG.supabaseAnonKey}`,
      }
    });
    if (!resp.ok) throw new Error(`Supabase respondeu com ${resp.status}`);
    return resp.json();
  }

  /* ==================================================================
     FILTROS
  ================================================================== */
  function estaAtivaOuFutura(f, hj) {
    const fimEfetivo = f.data_fim || f.data_inicio;
    return fimEfetivo >= hj;
  }

  function setTimeFilter(filter) {
    currentTimeFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    applyFilters();
  }

  function applyFilters() {
    const pesquisa = document.getElementById('search-input').value.trim().toLowerCase();
    const hj     = hoje();
    const lim30d = maisNDias(30);
    const lim3m  = maisNMeses(3);

    feirasFiltradas = todasFeiras.filter(f => {
      if (!estaAtivaOuFutura(f, hj)) return false;
      if (!f.data_inicio) return false;
      if (currentTimeFilter === '30d' && f.data_inicio > lim30d) return false;
      if (currentTimeFilter === '3m'  && f.data_inicio > lim3m)  return false;
      if (pesquisa) {
        const hay = [f.nome, f.localidade, f.municipio, f.distrito]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(pesquisa)) return false;
      }
      return true;
    });

    if (currentTab === 'lista') renderLista();
    else renderMapa();
  }

  /* ==================================================================
     RENDER: LISTA
  ================================================================== */
  function renderLista() {
    const container = document.getElementById('cards-container');
    const info      = document.getElementById('results-info');
    info.style.display = 'block';

    if (feirasFiltradas.length === 0) {
      info.textContent = '';
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">&#x1F3F0;</div>
          <h3>Nenhuma feira encontrada</h3>
          <p>Tenta ajustar os filtros ou a pesquisa.</p>
        </div>`;
      return;
    }

    info.textContent = `${feirasFiltradas.length} feiras encontradas`;
    container.innerHTML = feirasFiltradas.map((f, idx) => cardHTML(f, idx)).join('');
  }

  function cardHTML(f, idx) {
    const locPartes = [f.localidade, f.municipio, f.distrito].filter(Boolean);
    const locStr    = locPartes.join(', ') || 'Localização desconhecida';
    const temCoords = f.lat != null && f.lng != null;

    const imgTag = f.imagem_url
      ? `<img class="card-img" src="${esc(f.imagem_url)}" alt="${esc(f.nome)}" loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="card-img-placeholder" style="${f.imagem_url ? 'display:none' : ''}">&#x1F3F0;</div>`;

    const badgeFonte = f.fonte === 'feirasmedievais'
      ? '<span class="badge badge-fm">feirasmedievais.pt</span>'
      : '<span class="badge badge-adv">aondevamos.pt</span>';
    const badgeGps = temCoords ? '<span class="badge badge-gps">&#x1F4CC; GPS</span>' : '';

    return `
      <article class="card" onclick="openDetalhe(${idx})">
        ${imgTag}${placeholder}
        <div class="card-body">
          <h2 class="card-nome">${esc(f.nome)}</h2>
          <p class="card-dates">&#x1F4C5; ${formatPeriodo(f.data_inicio, f.data_fim)}</p>
          <p class="card-location">&#x1F4CD; ${esc(locStr)}</p>
          <div class="card-footer">
            <div class="badges">${badgeFonte}${badgeGps}</div>
            <span class="card-link">Ver detalhes &#x2192;</span>
          </div>
        </div>
      </article>`;
  }

  /* ==================================================================
     MODAL DE DETALHE
  ================================================================== */
  function openDetalhe(idx) {
    const f = feirasFiltradas[idx];
    if (!f) return;

    // Imagem
    const imgEl = document.getElementById('detalhe-img');
    const phEl  = document.getElementById('detalhe-img-ph');
    if (f.imagem_url) {
      imgEl.src = f.imagem_url;
      imgEl.alt = f.nome;
      imgEl.style.display = 'block';
      phEl.style.display  = 'none';
      imgEl.onerror = () => { imgEl.style.display = 'none'; phEl.style.display = 'flex'; };
    } else {
      imgEl.style.display = 'none';
      phEl.style.display  = 'flex';
    }

    // Nome
    document.getElementById('detalhe-nome').textContent = f.nome || '—';

    // Datas
    document.querySelector('#detalhe-datas span:last-child').textContent =
      formatPeriodo(f.data_inicio, f.data_fim);

    // Localização
    const locPartes = [f.localidade, f.municipio, f.distrito].filter(Boolean);
    document.querySelector('#detalhe-local span:last-child').textContent =
      locPartes.join(', ') || 'Localização desconhecida';

    // Coordenadas GPS
    const coordsRow = document.getElementById('detalhe-coords');
    if (f.lat != null && f.lng != null) {
      document.querySelector('#detalhe-coords span:last-child').textContent =
        `${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}`;
      coordsRow.style.display = 'flex';
    } else {
      coordsRow.style.display = 'none';
    }

    // Descrição
    const descRow = document.getElementById('detalhe-descricao');
    if (f.descricao) {
      document.querySelector('#detalhe-descricao span:last-child').textContent = f.descricao;
      descRow.style.display = 'flex';
    } else {
      descRow.style.display = 'none';
    }

    // Badges
    const badgeFonte = f.fonte === 'feirasmedievais'
      ? '<span class="badge badge-fm">feirasmedievais.pt</span>'
      : '<span class="badge badge-adv">aondevamos.pt</span>';
    const badgeGps = (f.lat != null && f.lng != null)
      ? '<span class="badge badge-gps">&#x1F4CC; GPS</span>' : '';
    document.getElementById('detalhe-badges').innerHTML = badgeFonte + badgeGps;

    // Botão web
    document.getElementById('detalhe-btn-web').href = f.fonte_url || '#';

    // Abrir sheet
    document.getElementById('detalhe-overlay').classList.add('aberto');
    document.getElementById('detalhe-sheet').classList.add('aberto');
    document.body.classList.add('sheet-aberto');
    document.getElementById('detalhe-sheet').scrollTop = 0;
  }

  function closeDetalhe() {
    document.getElementById('detalhe-overlay').classList.remove('aberto');
    document.getElementById('detalhe-sheet').classList.remove('aberto');
    document.body.classList.remove('sheet-aberto');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetalhe(); });

  /* ==================================================================
     RENDER: MAPA
  ================================================================== */
  function initMapa() {
    if (mapa) return;
    mapa = L.map('mapa').setView([39.5, -8.0], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(mapa);
  }

  function renderMapa() {
    initMapa();
    marcadores.forEach(m => mapa.removeLayer(m));
    marcadores = [];

    const comCoords = feirasFiltradas.filter(f => f.lat != null && f.lng != null);
    const semCoords = feirasFiltradas.length - comCoords.length;

    const infoEl = document.getElementById('map-info');
    if (feirasFiltradas.length === 0) {
      infoEl.textContent = 'Nenhuma feira corresponde aos filtros atuais.';
    } else {
      const semTxt = semCoords > 0 ? ` · ${semCoords} sem GPS` : '';
      infoEl.textContent = `${comCoords.length} de ${feirasFiltradas.length} feiras com GPS${semTxt}`;
    }

    comCoords.forEach(f => {
      const locPartes = [f.localidade, f.municipio].filter(Boolean).join(', ');
      const popup = `
        <div class="popup-nome">${esc(f.nome)}</div>
        <div class="popup-dates">&#x1F4C5; ${formatPeriodo(f.data_inicio, f.data_fim)}</div>
        ${locPartes ? `<div class="popup-loc">&#x1F4CD; ${esc(locPartes)}</div>` : ''}
        <a class="popup-link" href="${esc(f.fonte_url)}" target="_blank" rel="noopener">Ver mais &#x2192;</a>
      `;
      const m = L.marker([f.lat, f.lng]).bindPopup(popup);
      m.addTo(mapa);
      marcadores.push(m);
    });

    if (marcadores.length > 0) {
      mapa.fitBounds(L.featureGroup(marcadores).getBounds().pad(0.15));
    }
  }

  /* ==================================================================
     TROCA DE VISTA
  ================================================================== */
  function switchTab(tab) {
    currentTab = tab;

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.querySelectorAll('.desktop-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    document.getElementById('lista-view').style.display = tab === 'lista' ? 'block' : 'none';
    document.getElementById('map-view').style.display   = tab === 'mapa'  ? 'block' : 'none';
    document.getElementById('controls-bar').style.display = tab === 'lista' ? '' : 'none';
    document.getElementById('results-info').style.display  = tab === 'lista' ? '' : 'none';

    if (tab === 'mapa') {
      renderMapa();
      setTimeout(() => mapa && mapa.invalidateSize(), 50);
    }
  }

  /* ==================================================================
     INICIALIZACAO
  ================================================================== */
  async function init() {
    try {
      todasFeiras = await fetchFeiras();
      document.getElementById('loading').style.display = 'none';
      applyFilters();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.innerHTML = `
        <strong>&#x26A0;&#xFE0F; Não foi possível carregar os dados.</strong><br>
        ${esc(err.message)}<br>
        <small>Verifica se o <code>config.js</code> tem o URL e a chave anon corretos.</small>
      `;
    }
  }

  init();
</script>

</body>
</html>
